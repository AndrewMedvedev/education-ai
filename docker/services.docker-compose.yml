services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - ../.env
    environment:
      SRV_IAM_CLIENT_SECRET: ${SRV_IAM_CLIENT_SECRET:-${SRV_IAM_SECRET:-}}
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      S3_ENDPOINT_URL: http://s3:9000
      MAIL_SMTP_HOST: maildev
      MAIL_SMTP_PORT: 1025
      CHROMIUM_WS_ENDPOINT: ws://browserless:3000
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-${ADMIN_PASSWORD:?Set ADMIN_PASSWORD or SUPER_ADMIN_PASSWORD}}

    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_MEDIA_BASE_URL: /media
        VITE_STORAGE_PUBLIC_HOST: /storage
    ports:
      - "${FRONTEND_PORT}:80"

    restart: unless-stopped
    depends_on:
      cdn:
        condition: service_healthy
      backend:
        condition: service_healthy

  backup-ai:
    profiles: [backup]
    image: alpine:3.20
    container_name: backup-ai
    restart: unless-stopped
    volumes:
      - ../backups:/backups
      - ../scripts/backup_script.sh:/app/backup.sh:ro
      - ../.env:/app/.env:ro
      - ./.docker/minio-data:/minio_data:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MINIO_ACCESS_KEY_ID=${YANDEX_CLOUD_ACCESS_KEY_ID}
      - MINIO_SECRET_ACCESS_KEY=${YANDEX_CLOUD_SECRET_ACCESS_KEY}
      # Yandex Cloud credentials (можно взять из .env)
      - YANDEX_S3_BUCKET=backups
      - YANDEX_S3_ENDPOINT=https://storage.yandexcloud.net
    command: |
      /bin/sh -c "
      apk add --no-cache postgresql-client curl openssl
      echo '0 2 * * * /app/backup.sh >> /var/log/backup.log 2>&1' | crontab -
      crond -f
      "
