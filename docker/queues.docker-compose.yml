services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBIT_PORT}:5672"   # AMQP protocol
      - "${RABBIT_MANAGEMENT_PORT}:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  taskiq:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - taskiq
      - worker
      - src.core.tkq:taskiq_broker
      - src.courses.infra.tasks
      - --workers
      - "${TASKIQ_WORKERS:-1}"
      - --max-async-tasks
      - "${TASKIQ_MAX_ASYNC_TASKS:-25}"
      - --ack-type
      - when_saved
      - --shutdown-timeout
      - "600"
      - --wait-tasks-timeout
      - "600"
    env_file:
      - ../.env
    environment:
      SRV_IAM_CLIENT_SECRET: ${SRV_IAM_CLIENT_SECRET:-${SRV_IAM_SECRET:-}}
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      S3_ENDPOINT_URL: http://s3:9000
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-maildev}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      CHROMIUM_WS_ENDPOINT: ws://browserless:3000
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-${ADMIN_EMAIL:-admin@example.com}}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-${ADMIN_PASSWORD:?Set ADMIN_PASSWORD or SUPER_ADMIN_PASSWORD}}

    expose:
      - "9000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    stop_grace_period: 10m



volumes:
  rabbitmq_data:
